[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: slow tests that take 30+ seconds (deselect with -m "not slow")
    integration: integration tests covering full pipeline
    unit: unit tests for individual components
    e2e: end-to-end tests

addopts =
    --verbose
    --tb=short
    --strict-markers
    -m "not slow"

timeout = 300
